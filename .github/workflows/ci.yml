name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Tests (py${{ matrix.python-version }}) / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]          # arm64 vía runner si se agrega; amd64 por defecto
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # WeasyPrint necesita libs de sistema en Linux
      - name: Install system deps (WeasyPrint)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # PPTX requiere Playwright + Chromium (solo para el test E2E de create_pptx)
      - name: Install Playwright + Chromium (for PPTX e2e)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium || echo "WARN: Chromium no disponible; e2e de pptx fallará"

      - name: Run tests (core + MCP e2e)
        run: |
          pytest tests/test_core.py -q
          pytest tests/test_e2e_mcp.py -q

  build:
    name: Build sdist+wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
