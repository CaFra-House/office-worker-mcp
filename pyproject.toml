[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "office-worker-mcp"
version = "0.9.3"
description = "The Office Worker — your agent's document clerk: Word, Excel, PowerPoint & PDF with real design (templates + themes + PDF input)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Julio Cardozo" }]
keywords = ["mcp", "office", "pdf", "docx", "xlsx", "pptx", "documents", "agent", "templates", "signature", "compression", "batch", "edit", "charts", "preview", "vision", "redact", "rag", "security", "skills", "flatten", "mail-merge", "markdown", "diff", "compliance", "encryption", "verify", "pivot", "book", "epub", "doctor"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Communications",
    "Topic :: Text Processing :: Markup",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.27,<2",
    "python-docx>=1.0",
    "docxtpl>=0.20",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "weasyprint>=60",
    "jinja2>=3.1",
    "PyMuPDF>=1.24",
    "pdfplumber>=0.11",
    "pypdf>=4",
    "reportlab>=4.0",
    "pandas>=2.0",
    "msoffcrypto-tool>=5.4",
    "cryptography>=42.0.0",
    "pyhanko>=0.25.0",
]

# PPTX editable requiere html-to-pptx + Playwright/Chromium (pesado, con navegador).
# Se declara como extra opcional para no forzar Chromium a quien solo usa PDF/Word/Excel.
[project.optional-dependencies]
pptx = ["html-to-pptx>=0.3", "playwright>=1.40"]
ocr = ["pillow>=10", "pytesseract>=0.3.10"]
sign = ["pyhanko>=0.25.0", "cryptography>=42.0.0"]
book = ["ebooklib>=0.18"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "docxtpl>=0.20",
    "html-to-pptx>=0.3",
    "playwright>=1.40",
    "pillow>=10",
    "pytesseract>=0.3.10",
    "pyhanko>=0.25.0",
    "cryptography>=42.0.0",
    "ebooklib>=0.18",
]

[project.scripts]
# Cara CLI (opcional) para no-tecnicos/scripts; el MCP es la cara principal para agentes IA.
owi = "office_worker.cli:main"
# Command del MCP server (stdio) — el que va en la config mcpServers del agente.
office-worker-mcp = "office_worker.mcp_server:main"

[project.entry-points."mcp.servers"]
office_worker = "office_worker.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"office_worker" = ["templates_data/*.docx", "skills/*.md"]

